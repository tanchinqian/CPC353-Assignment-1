<svg xmlns="http://www.w3.org/2000/svg" width="234pt" height="174pt" viewBox="0 0 234 174">
  <title>Workflow for the implemented analyses</title>
  <desc>All 125 reviews undergo validation, cleaning and tokenization. The resulting corpus feeds concordance analysis, stop-word analysis, and n-gram analysis.</desc>
  <rect width="234" height="174" fill="white"/>
  <g fill="#f4f4f4" stroke="#333" stroke-width="0.7">
    <path d="M36 3 H210 L198 39 H24 Z"/>
    <rect x="29" y="60" width="176" height="37"/>
    <rect x="2" y="123" width="74" height="49"/>
    <rect x="80" y="123" width="74" height="49"/>
    <rect x="158" y="123" width="74" height="49"/>
  </g>
  <g fill="none" stroke="#333" stroke-width="0.8">
    <path d="M117 39 V56"/>
    <path d="M117 97 V110 H39 V119"/>
    <path d="M117 97 V119"/>
    <path d="M117 110 H195 V119"/>
  </g>
  <g fill="#333">
    <path d="M114.5 54 L117 59 L119.5 54 Z"/>
    <path d="M36.5 117 L39 122 L41.5 117 Z"/>
    <path d="M114.5 117 L117 122 L119.5 117 Z"/>
    <path d="M192.5 117 L195 122 L197.5 117 Z"/>
  </g>
  <g font-family="Times New Roman, Times, serif" text-anchor="middle" fill="#111">
    <text x="117" y="17" font-size="8.5" font-weight="bold">125 review rows</text>
    <text x="117" y="30" font-size="8.5">57 collected + 68 AI-generated</text>
    <text x="117" y="75" font-size="8.5" font-weight="bold">Validate, clean and tokenize</text>
    <text x="117" y="88" font-size="8.5">125 reviews · 2,252 tokens</text>
    <text x="39" y="134" font-size="7.5" font-weight="bold">Concordance analysis</text>
    <text x="39" y="145" font-size="7">Query unfiltered</text>
    <text x="39" y="154" font-size="7">sentences</text>
    <text x="39" y="164" font-size="7">Extract KWIC contexts</text>
    <text x="117" y="135" font-size="7.5" font-weight="bold">Stop-word analysis</text>
    <text x="117" y="148" font-size="7">Compare token counts</text>
    <text x="117" y="160" font-size="7">Measure removal rates</text>
    <text x="195" y="135" font-size="7.5" font-weight="bold">N-gram analysis</text>
    <text x="195" y="148" font-size="7">Extract bi- &amp; trigrams</text>
    <text x="195" y="160" font-size="7">Cross-language pairs</text>
  </g>
</svg>
